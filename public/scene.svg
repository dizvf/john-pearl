<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#120626" />
      <stop offset="34%"  stop-color="#2d0b44" />
      <stop offset="58%"  stop-color="#6d1458" />
      <stop offset="78%"  stop-color="#b8275f" />
      <stop offset="100%" stop-color="#2a0730" />
    </linearGradient>

    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff0b8" />
      <stop offset="32%"  stop-color="#ffb347" />
      <stop offset="64%"  stop-color="#ff4fa0" />
      <stop offset="100%" stop-color="#c21e8a" />
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ff2b90" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ff2b90" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff2b90" stop-opacity="0.05" />
      <stop offset="35%"  stop-color="#ff2b90" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b63d6" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b0a2e" />
      <stop offset="100%" stop-color="#2a0c38" />
    </linearGradient>

    <!-- Solid at the top, thinning bands toward the horizon, nothing below
         it: the sun sets behind the skyline rather than over the grid. -->
    <mask id="sunMask">
      <rect x="0" y="0" width="1200" height="800" fill="black" />
      <rect x="0" y="0"   width="1200" height="396" fill="white" />
      <rect x="0" y="401" width="1200" height="7"   fill="white" />
      <rect x="0" y="413" width="1200" height="6"   fill="white" />
      <rect x="0" y="426" width="1200" height="5"   fill="white" />
      <rect x="0" y="440" width="1200" height="4"   fill="white" />
      <rect x="0" y="454" width="1200" height="3.2" fill="white" />
      <rect x="0" y="465" width="1200" height="2.4" fill="white" />
    </mask>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />

  <g fill="#fff6ff">
    <circle cx="118"  cy="72"  r="1.5" opacity="0.5" />
    <circle cx="286"  cy="128" r="1.1" opacity="0.35" />
    <circle cx="402"  cy="58"  r="1.3" opacity="0.4" />
    <circle cx="548"  cy="162" r="1"   opacity="0.3" />
    <circle cx="676"  cy="92"  r="1.6" opacity="0.45" />
    <circle cx="824"  cy="46"  r="1.1" opacity="0.32" />
    <circle cx="948"  cy="146" r="1.4" opacity="0.38" />
    <circle cx="1078" cy="84"  r="1.2" opacity="0.3" />
    <circle cx="1158" cy="196" r="1"   opacity="0.26" />
    <circle cx="212"  cy="214" r="1.1" opacity="0.24" />
  </g>

  <ellipse cx="860" cy="466" rx="430" ry="190" fill="url(#glow)" />
  <circle cx="860" cy="392" r="150" fill="url(#sunG)" mask="url(#sunMask)" />

  <g fill="url(#tower)">
    <rect x="18"   y="372" width="54" height="98" />
    <rect x="80"   y="410" width="38" height="60" />
    <rect x="126"  y="338" width="46" height="132" />
    <rect x="180"  y="396" width="60" height="74" />
    <rect x="248"  y="300" width="42" height="170" />
    <rect x="298"  y="382" width="52" height="88" />
    <rect x="358"  y="420" width="44" height="50" />
    <rect x="424"  y="436" width="36" height="34" />
    <rect x="464"  y="449" width="26" height="21" />
    <rect x="684"  y="432" width="38" height="38" />
    <rect x="770"  y="408" width="48" height="62" />
    <rect x="826"  y="346" width="40" height="124" />
    <rect x="874"  y="392" width="58" height="78" />
    <rect x="940"  y="316" width="44" height="154" />
    <rect x="992"  y="400" width="50" height="70" />
    <rect x="1050" y="364" width="62" height="106" />
    <rect x="1120" y="414" width="46" height="56" />
  </g>

  <g stroke="#2a0c38" stroke-width="2">
    <line x1="269" y1="300" x2="269" y2="272" />
    <line x1="962" y1="316" x2="962" y2="286" />
  </g>

  <g fill="#ffc46b" opacity="0.5">
    <rect x="30"   y="388" width="4" height="7" /><rect x="42" y="404" width="4" height="7" />
    <rect x="138"  y="356" width="4" height="7" /><rect x="152" y="382" width="4" height="7" />
    <rect x="258"  y="322" width="4" height="7" /><rect x="272" y="350" width="4" height="7" />
    <rect x="258"  y="394" width="4" height="7" /><rect x="310" y="400" width="4" height="7" />
    <rect x="838"  y="368" width="4" height="7" /><rect x="852" y="402" width="4" height="7" />
    <rect x="950"  y="338" width="4" height="7" /><rect x="964" y="372" width="4" height="7" />
    <rect x="1062" y="386" width="4" height="7" /><rect x="1086" y="418" width="4" height="7" />
  </g>

  <rect x="0" y="468" width="1200" height="3" fill="#ff6aa8" opacity="0.5" />

  <g stroke="url(#grid)" stroke-width="1.1" fill="none">
    <line x1="600" y1="470" x2="-620" y2="800" /><line x1="600" y1="470" x2="-330" y2="800" />
    <line x1="600" y1="470" x2="-110" y2="800" /><line x1="600" y1="470" x2="60"   y2="800" />
    <line x1="600" y1="470" x2="200"  y2="800" /><line x1="600" y1="470" x2="320"  y2="800" />
    <line x1="600" y1="470" x2="425"  y2="800" /><line x1="600" y1="470" x2="518"  y2="800" />
    <line x1="600" y1="470" x2="600"  y2="800" /><line x1="600" y1="470" x2="682"  y2="800" />
    <line x1="600" y1="470" x2="775"  y2="800" /><line x1="600" y1="470" x2="880"  y2="800" />
    <line x1="600" y1="470" x2="1000" y2="800" /><line x1="600" y1="470" x2="1140" y2="800" />
    <line x1="600" y1="470" x2="1310" y2="800" /><line x1="600" y1="470" x2="1530" y2="800" />
    <line x1="600" y1="470" x2="1820" y2="800" />

    <line x1="0" y1="477" x2="1200" y2="477" /><line x1="0" y1="487" x2="1200" y2="487" />
    <line x1="0" y1="500" x2="1200" y2="500" /><line x1="0" y1="517" x2="1200" y2="517" />
    <line x1="0" y1="539" x2="1200" y2="539" /><line x1="0" y1="567" x2="1200" y2="567" />
    <line x1="0" y1="603" x2="1200" y2="603" /><line x1="0" y1="649" x2="1200" y2="649" />
    <line x1="0" y1="707" x2="1200" y2="707" /><line x1="0" y1="779" x2="1200" y2="779" />
  </g>
</svg>
