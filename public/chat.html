<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0416" />
<title>Chat &middot; Pearl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }

  .shell { position: relative; flex: 1; min-height: 0; display: flex; background: var(--ink); }
  .shell > .scene-bg { opacity: 0.28; }
  .shell > .scrim { background: linear-gradient(180deg, rgba(7,3,17,.9), rgba(7,3,17,.82)); }

  /* ---------- sidebar ---------- */

  .side {
    position: relative;
    z-index: 3;
    width: 292px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 14px;
    border-right: 1px solid var(--line);
    background: rgba(10, 4, 20, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    overflow-y: auto;
  }

  .side h2 {
    margin: 0 0 8px;
    font: 500 10.5px/1 var(--mono);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .adder { display: flex; gap: 6px; }
  .adder .input { height: 34px; font-size: 13px; }
  .adder .btn { height: 34px; padding: 0 13px; }

  .list { display: flex; flex-direction: column; gap: 3px; }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: var(--text);
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: background 0.14s, border-color 0.14s;
  }
  .item:hover { background: rgba(255, 255, 255, 0.055); }
  .item[aria-current="true"] { background: rgba(255, 43, 144, 0.15); border-color: rgba(255, 43, 144, 0.4); }

  .avatar {
    width: 32px; height: 32px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--sunset);
    color: #2a0616;
    font: 700 13px/1 Inter, sans-serif;
    position: relative;
  }
  .avatar.group { background: linear-gradient(135deg, var(--blue), var(--violet)); color: #f3e9ff; }
  .avatar .live {
    position: absolute;
    right: -2px; bottom: -2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid #120722;
    background: var(--muted);
  }
  .avatar .live[data-on="true"] { background: var(--ok); }

  .meta { min-width: 0; flex: 1; }
  .meta .name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .last { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { font-size: 12.5px; color: var(--muted); padding: 6px 2px; line-height: 1.5; }

  .mini { height: 26px; padding: 0 10px; font-size: 11.5px; border-radius: 8px; }

  /* ---------- conversation ---------- */

  .room { position: relative; z-index: 2; flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .room-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 4, 20, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .room-head .title { font-size: 15px; font-weight: 600; }
  .room-head .who { font-size: 11.5px; color: var(--muted); }

  .log { flex: 1; overflow-y: auto; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 3px; }

  .msg { display: flex; gap: 10px; padding: 3px 0; }
  .msg .avatar { width: 30px; height: 30px; font-size: 12px; }
  .msg.cont { padding-top: 0; }
  .msg.cont .avatar { visibility: hidden; height: 0; }

  .bubble { min-width: 0; }
  .bubble .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1px; }
  .bubble .who b { font-size: 13px; font-weight: 600; }
  .bubble .who time { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
  .bubble .body { font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.mine .bubble .who b { color: var(--amber); }

  .day {
    align-self: center;
    margin: 12px 0 6px;
    padding: 3px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.35);
    font: 500 10px/1.6 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .typing { height: 18px; padding: 0 18px 4px; font-size: 11.5px; color: var(--muted); font-style: italic; }

  .composer {
    display: flex;
    gap: 9px;
    align-items: flex-end;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
    background: rgba(10, 4, 20, 0.66);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .composer textarea {
    flex: 1;
    min-height: 42px;
    max-height: 160px;
    padding: 11px 15px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.45);
    color: var(--text);
    font: 400 14px/1.45 Inter, sans-serif;
    resize: none;
  }
  .composer textarea:focus {
    outline: none;
    border-color: rgba(255, 43, 144, 0.75);
    box-shadow: 0 0 0 4px rgba(255, 43, 144, 0.12);
  }
  .composer .btn-primary { height: 42px; }

  .blank {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 30px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
  }

  .drawer-btn { display: none; }

  @media (max-width: 820px) {
    :root { --chrome-h: 54px; }
    .brand { font-size: 20px; }
    .drawer-btn { display: grid; }
    .side {
      position: absolute;
      inset: 0 auto 0 0;
      width: min(310px, 86vw);
      transform: translateX(-102%);
      transition: transform 0.22s ease;
      z-index: 6;
      box-shadow: 30px 0 60px rgba(0, 0, 0, 0.5);
    }
    .side.open { transform: none; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="chrome">
  <button class="icon drawer-btn" id="drawer" title="Conversations" aria-label="Conversations">&#9776;</button>
  <a class="brand" href="/">PEARL</a>
  <nav class="tabs">
    <a class="tab" href="/proxy">Proxy</a>
    <a class="tab" href="/chat" aria-current="page">Chat</a>
  </nav>
  <span class="spacer"></span>
  <span class="pip"><span class="dot" id="netDot" data-state="booting"></span><span id="netText">Connecting</span></span>
</header>

<div class="shell">
  <div class="scene-bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <aside class="side" id="side">
    <div>
      <h2>Add a friend</h2>
      <form class="adder" id="addFriend">
        <input class="input" id="friendHandle" placeholder="username" spellcheck="false" maxlength="20" />
        <button class="btn" type="submit">Add</button>
      </form>
      <p class="notice" id="sideNotice" hidden style="margin-top:9px"></p>
    </div>

    <div>
      <h2>Conversations</h2>
      <div class="list" id="rooms"></div>
      <button class="btn mini" id="newGroup" style="margin-top:9px">+ New group</button>
    </div>

    <div>
      <h2>Friends</h2>
      <div class="list" id="friends"></div>
    </div>
  </aside>

  <section class="room">
    <div class="room-head" id="roomHead" hidden>
      <div class="meta">
        <div class="title" id="roomTitle"></div>
        <div class="who" id="roomWho"></div>
      </div>
      <button class="btn mini" id="inviteBtn" hidden>Invite</button>
      <button class="btn mini" id="leaveBtn">Leave</button>
    </div>

    <div class="blank" id="blank">
      Pick a conversation, or add a friend to start one.<br />
      Friend requests have to be accepted before you can message.
    </div>

    <div class="log" id="log" hidden></div>
    <div class="typing" id="typing"></div>

    <form class="composer" id="composer" hidden>
      <textarea id="input" rows="1" placeholder="Write a message" maxlength="2000"></textarea>
      <button class="btn btn-primary" type="submit">SEND</button>
    </form>
  </section>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const els = {
  netDot: $("netDot"), netText: $("netText"), side: $("side"), drawer: $("drawer"),
  addFriend: $("addFriend"), friendHandle: $("friendHandle"), sideNotice: $("sideNotice"),
  rooms: $("rooms"), friends: $("friends"), newGroup: $("newGroup"),
  roomHead: $("roomHead"), roomTitle: $("roomTitle"), roomWho: $("roomWho"),
  inviteBtn: $("inviteBtn"), leaveBtn: $("leaveBtn"),
  blank: $("blank"), log: $("log"), typing: $("typing"),
  composer: $("composer"), input: $("input"),
};

const state = { me: null, rooms: [], friends: [], activeId: null, online: new Set() };
const clock = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
const calendar = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "short", day: "numeric" });

/* ---------- api ---------- */

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: options.body ? { "content-type": "application/json" } : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "That did not work.");
  return data;
}

function flash(message, good = false) {
  els.sideNotice.textContent = message;
  els.sideNotice.classList.toggle("good", good);
  els.sideNotice.hidden = false;
  clearTimeout(flash.timer);
  flash.timer = setTimeout(() => { els.sideNotice.hidden = true; }, 4000);
}

const initials = (name) => String(name || "?").trim().slice(0, 1).toUpperCase();

function avatar(name, { group = false, online = null } = {}) {
  const el = document.createElement("span");
  el.className = group ? "avatar group" : "avatar";
  el.textContent = initials(name);
  if (online !== null) {
    const live = document.createElement("i");
    live.className = "live";
    live.dataset.on = String(Boolean(online));
    el.append(live);
  }
  return el;
}

/* ---------- sidebar ---------- */

function renderRooms() {
  els.rooms.textContent = "";
  if (!state.rooms.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No conversations yet.";
    els.rooms.append(p);
    return;
  }
  for (const room of state.rooms) {
    const button = document.createElement("button");
    button.className = "item";
    button.setAttribute("aria-current", String(room.id === state.activeId));

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = room.name;
    const last = document.createElement("div");
    last.className = "last";
    last.textContent = room.lastBody || (room.kind === "group" ? `${room.members.length} members` : "No messages yet");
    meta.append(name, last);

    button.append(
      avatar(room.name, { group: room.kind === "group", online: room.kind === "dm" ? room.online : null }),
      meta
    );
    button.addEventListener("click", () => openRoom(room.id));
    els.rooms.append(button);
  }
}

function renderFriends() {
  els.friends.textContent = "";
  if (!state.friends.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No friends yet. Add someone by their username above.";
    els.friends.append(p);
    return;
  }

  const order = [...state.friends].sort((a, b) =>
    Number(b.incoming) - Number(a.incoming) || a.user.username.localeCompare(b.user.username)
  );

  for (const friend of order) {
    const row = document.createElement("div");
    row.className = "item";
    row.style.cursor = friend.status === "accepted" ? "pointer" : "default";

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = friend.user.username;
    const sub = document.createElement("div");
    sub.className = "last";
    sub.textContent =
      friend.status === "accepted"
        ? (state.online.has(friend.user.id) ? "online" : "offline")
        : friend.incoming ? "wants to be friends" : "request sent";
    meta.append(name, sub);

    row.append(avatar(friend.user.username, {
      online: friend.status === "accepted" ? state.online.has(friend.user.id) : null,
    }), meta);

    if (friend.incoming) {
      const yes = document.createElement("button");
      yes.className = "btn mini";
      yes.textContent = "Accept";
      yes.addEventListener("click", async (event) => {
        event.stopPropagation();
        try {
          await api(`/api/friends/${friend.id}/accept`, { method: "POST" });
          await refresh();
        } catch (error) { flash(error.message); }
      });
      row.append(yes);
    } else if (friend.status === "accepted") {
      row.addEventListener("click", () => startDirect(friend.user.handle));
    }

    els.friends.append(row);
  }
}

/* ---------- conversation ---------- */

function sameDay(a, b) {
  return a && b && new Date(a).toDateString() === new Date(b).toDateString();
}

function addMessage(message, previous) {
  if (!sameDay(previous?.createdAt, message.createdAt)) {
    const day = document.createElement("div");
    day.className = "day";
    day.textContent = calendar.format(new Date(message.createdAt));
    els.log.append(day);
    previous = null;
  }

  const run = previous && previous.userId === message.userId;
  const row = document.createElement("div");
  row.className = "msg" + (run ? " cont" : "") + (message.userId === state.me.id ? " mine" : "");
  row.append(avatar(message.username));

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (!run) {
    const who = document.createElement("div");
    who.className = "who";
    const b = document.createElement("b");
    b.textContent = message.username;
    const time = document.createElement("time");
    time.textContent = clock.format(new Date(message.createdAt));
    who.append(b, time);
    bubble.append(who);
  }
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = message.body;          // never innerHTML
  bubble.append(body);

  row.append(bubble);
  els.log.append(row);
  return message;
}

let lastRendered = null;

function atBottom() {
  return els.log.scrollHeight - els.log.scrollTop - els.log.clientHeight < 90;
}

async function openRoom(id) {
  state.activeId = id;
  els.side.classList.remove("open");
  const room = state.rooms.find((r) => r.id === id);
  if (!room) return;

  els.blank.hidden = true;
  els.log.hidden = false;
  els.composer.hidden = false;
  els.roomHead.hidden = false;
  els.roomTitle.textContent = room.name;
  els.roomWho.textContent =
    room.kind === "group"
      ? room.members.map((m) => m.username).join(", ")
      : room.online ? "online" : "offline";
  els.inviteBtn.hidden = room.kind !== "group";

  renderRooms();

  els.log.textContent = "";
  lastRendered = null;
  const { messages } = await api(`/api/rooms/${id}/messages`);
  for (const message of messages) lastRendered = addMessage(message, lastRendered);
  els.log.scrollTop = els.log.scrollHeight;
  els.input.focus();
}

async function startDirect(handle) {
  try {
    const { roomId } = await api("/api/rooms/dm", {
      method: "POST",
      body: JSON.stringify({ handle }),
    });
    await refresh();
    await openRoom(roomId);
  } catch (error) { flash(error.message); }
}

/* ---------- data ---------- */

async function refresh() {
  const [rooms, friends] = await Promise.all([api("/api/rooms"), api("/api/friends")]);
  state.rooms = rooms.rooms;
  state.friends = friends.friends;
  renderRooms();
  renderFriends();
}

/* ---------- socket ---------- */

let socket = null;
let backoff = 1000;

function setNet(stateName, text) {
  els.netDot.dataset.state = stateName;
  els.netText.textContent = text;
}

function connect() {
  socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);

  socket.addEventListener("open", () => {
    backoff = 1000;
    setNet("ready", "Live");
  });

  socket.addEventListener("close", () => {
    setNet("error", "Offline");
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  });

  socket.addEventListener("message", async (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }

    if (data.type === "hello") {
      state.online = new Set(data.online);
      renderFriends();
      return;
    }

    if (data.type === "message") {
      const message = data.message;
      if (message.roomId === state.activeId) {
        const stick = atBottom();
        lastRendered = addMessage(message, lastRendered);
        if (stick) els.log.scrollTop = els.log.scrollHeight;
      }
      const room = state.rooms.find((r) => r.id === message.roomId);
      if (room) {
        room.lastBody = message.body;
        state.rooms.sort((a, b) => (a.id === message.roomId ? -1 : b.id === message.roomId ? 1 : 0));
        renderRooms();
      } else {
        await refresh();
      }
      return;
    }

    if (data.type === "presence") {
      if (data.online) state.online.add(data.userId);
      else state.online.delete(data.userId);
      renderFriends();
      return;
    }

    if (data.type === "typing" && data.roomId === state.activeId) {
      els.typing.textContent = `${data.username} is typing…`;
      clearTimeout(connect.typingTimer);
      connect.typingTimer = setTimeout(() => { els.typing.textContent = ""; }, 2500);
      return;
    }

    if (data.type === "friend-request") {
      flash(`${data.from.username} wants to be friends.`, true);
      await refresh();
      return;
    }

    if (data.type === "friend-accepted") {
      flash(`${data.by.username} accepted your request.`, true);
      await refresh();
      return;
    }

    if (data.type === "rooms-changed" || data.type === "members-changed") {
      await refresh();
      return;
    }

    if (data.type === "error") flash(data.error);
  });
}

/* ---------- events ---------- */

els.drawer.addEventListener("click", () => els.side.classList.toggle("open"));

els.addFriend.addEventListener("submit", async (event) => {
  event.preventDefault();
  const handle = els.friendHandle.value.trim();
  if (!handle) return;
  try {
    await api("/api/friends/request", { method: "POST", body: JSON.stringify({ handle }) });
    els.friendHandle.value = "";
    flash("Request sent.", true);
    await refresh();
  } catch (error) { flash(error.message); }
});

els.newGroup.addEventListener("click", async () => {
  const name = prompt("Name this group");
  if (!name) return;
  const friends = state.friends.filter((f) => f.status === "accepted");
  if (!friends.length) return flash("Add a friend first.");
  const picked = prompt(
    `Who joins? Comma-separated usernames.\nYour friends: ${friends.map((f) => f.user.handle).join(", ")}`
  );
  try {
    const { roomId } = await api("/api/rooms", {
      method: "POST",
      body: JSON.stringify({
        name,
        handles: String(picked || "").split(",").map((s) => s.trim()).filter(Boolean),
      }),
    });
    await refresh();
    await openRoom(roomId);
  } catch (error) { flash(error.message); }
});

els.inviteBtn.addEventListener("click", async () => {
  const handle = prompt("Username to add");
  if (!handle) return;
  try {
    await api(`/api/rooms/${state.activeId}/invite`, {
      method: "POST",
      body: JSON.stringify({ handle }),
    });
    await refresh();
    flash("Added.", true);
  } catch (error) { flash(error.message); }
});

els.leaveBtn.addEventListener("click", async () => {
  if (!state.activeId || !confirm("Leave this conversation?")) return;
  await api(`/api/rooms/${state.activeId}/leave`, { method: "POST" });
  state.activeId = null;
  els.log.hidden = true;
  els.composer.hidden = true;
  els.roomHead.hidden = true;
  els.blank.hidden = false;
  await refresh();
});

function send() {
  const body = els.input.value.trim();
  if (!body || !state.activeId || socket?.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ type: "send", roomId: state.activeId, body }));
  els.input.value = "";
  els.input.style.height = "auto";
}

els.composer.addEventListener("submit", (event) => { event.preventDefault(); send(); });

els.input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
});

let typingSentAt = 0;
els.input.addEventListener("input", () => {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
  const now = Date.now();
  if (state.activeId && socket?.readyState === WebSocket.OPEN && now - typingSentAt > 1800) {
    typingSentAt = now;
    socket.send(JSON.stringify({ type: "typing", roomId: state.activeId }));
  }
});

/* ---------- start ---------- */

const me = await (await fetch("/api/me")).json();
if (!me.user) {
  location.replace("/login?next=/chat");
} else {
  state.me = me.user;
  await refresh();
  connect();
}
</script>
</body>
</html>
