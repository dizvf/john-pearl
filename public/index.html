<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0416" />
<title>Pearl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }

  main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--ink); }

  .copy {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 clamp(22px, 7vw, 116px) 64px;
    gap: 16px;
    max-width: min(820px, 94%);
  }

  .wordmark { font-size: clamp(60px, 15vw, 148px); }

  .tagline {
    margin: 0;
    max-width: 33ch;
    font-size: 15px;
    line-height: 1.6;
    color: rgba(247, 238, 251, 0.78);
  }

  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .cta .btn { height: 42px; padding: 0 22px; text-decoration: none; display: inline-flex; align-items: center; }

  /* Bottom strip: facts in mono, not feature cards. */
  .strip {
    position: relative;
    z-index: 3;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 28px;
    padding: 12px clamp(22px, 7vw, 116px);
    background: rgba(7, 3, 17, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    font: 500 10.5px/1.9 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .strip b { color: rgba(255, 196, 107, 0.92); font-weight: 500; }

  @media (max-width: 720px) {
    :root { --chrome-h: 54px; }
    .chrome { padding: 0 12px; gap: 6px; }
    .brand { font-size: 20px; }
    .tab { padding: 6px 10px; font-size: 11px; }
    .scrim {
      background: linear-gradient(180deg, rgba(7,3,17,.72) 0%, rgba(7,3,17,.18) 26%, rgba(7,3,17,.8) 58%, rgba(7,3,17,.97) 100%);
    }
    .copy { justify-content: flex-end; padding: 0 24px 34px; max-width: 100%; }
    .wordmark { font-size: clamp(64px, 18vw, 150px); }
    .strip { gap: 0 18px; font-size: 9.5px; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="chrome">
  <a class="brand" href="/">PEARL</a>
  <nav class="tabs">
    <a class="tab" href="/proxy">Proxy</a>
    <a class="tab" href="/chat">Chat</a>
  </nav>
  <span class="spacer"></span>
  <span id="session"></span>
</header>

<main>
  <div class="scene-bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <div class="copy">
    <span class="rule"></span>
    <p class="eyebrow">Encrypted relay &middot; Leonida</p>
    <h1 class="wordmark">PEARL</h1>
    <p class="tagline">
      Browse through your own server, and talk to your people while you do it.
    </p>
    <div class="cta">
      <a class="btn btn-primary" href="/proxy">OPEN THE PROXY</a>
      <a class="btn" href="/chat" id="chatCta">Open chat</a>
    </div>
  </div>
</main>

<footer class="strip">
  <span><b>Relay</b> &middot; requests leave from the server, not your browser</span>
  <span><b>Chat</b> &middot; friends, direct messages, group rooms</span>
  <span><b>Accounts</b> &middot; needed for chat, not for the proxy</span>
</footer>

<script type="module">
const session = document.getElementById("session");

function render(user) {
  session.textContent = "";
  if (user) {
    const pip = document.createElement("span");
    pip.className = "pip";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.dataset.state = "ready";
    pip.append(dot, document.createTextNode(user.username));

    const out = document.createElement("button");
    out.className = "btn";
    out.style.cssText = "height:32px;padding:0 14px;margin-left:8px";
    out.textContent = "Sign out";
    out.addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      location.reload();
    });

    session.append(pip, out);
  } else {
    const link = document.createElement("a");
    link.className = "btn";
    link.href = "/login";
    link.style.cssText = "height:32px;padding:0 16px;text-decoration:none;display:inline-flex;align-items:center";
    link.textContent = "Sign in";
    session.append(link);
  }
}

try {
  const res = await fetch("/api/me");
  const data = await res.json();
  render(data.user);
} catch {
  render(null);
}
</script>
</body>
</html>
